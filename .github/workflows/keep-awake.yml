name: Keep the demo site awake

# Streamlit Community Cloud puts an app to sleep after 12 hours without visitors.
# This visits the site every 6 hours in a real browser so students never find it asleep.
# To stop it, disable the workflow in the Actions tab or delete this file.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit the site
        run: python .github/keep_awake.py
