<!-- Chiptune arrangement of "Korobeiniki", a Russian folk song in the public domain.
     Synthesized live with the Web Audio API. It starts only when the visitor clicks. -->
<style>
  body { margin: 0; background: transparent; }
  #m { font-family: 'Courier New', monospace; font-weight: bold; font-size: 14px; color: #0D110C;
       background: #8BE04E; border: 0; padding: 8px 12px; cursor: pointer; width: 100%;
       box-shadow: 3px 3px 0 #050705; }
  #m.on { background: #F2A541; }
  #m:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #050705; }
</style>
<button id="m" title="Korobeiniki, a Russian folk song, in an original 8-bit arrangement">PLAY TRAIL MUSIC</button>
<script>
const MIDI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function freq(name) {
  const sharp = name.includes("#");
  const letter = name[0];
  const octave = parseInt(name.slice(sharp ? 2 : 1), 10);
  const midi = 12 * (octave + 1) + MIDI[letter] + (sharp ? 1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
// Melody in eighth notes: [note or null for a rest, length in eighths]. Eight bars of eight eighths.
const MELODY = [
  ["E5", 2], ["B4", 1], ["C5", 1], ["D5", 2], ["C5", 1], ["B4", 1],
  ["A4", 2], ["A4", 1], ["C5", 1], ["E5", 2], ["D5", 1], ["C5", 1],
  ["B4", 3], ["C5", 1], ["D5", 2], ["E5", 2],
  ["C5", 2], ["A4", 2], ["A4", 2], [null, 2],
  [null, 1], ["D5", 2], ["F5", 1], ["A5", 2], ["G5", 1], ["F5", 1],
  ["E5", 3], ["C5", 1], ["E5", 2], ["D5", 1], ["C5", 1],
  ["B4", 2], ["B4", 1], ["C5", 1], ["D5", 2], ["E5", 2],
  ["C5", 2], ["A4", 2], ["A4", 2], [null, 2],
];
// Bass: one root per bar, played as low-high eighths.
const BASS_ROOTS = ["E2", "A2", "G#2", "A2", "D2", "C2", "G#2", "A2"];
const STEPS = 64;
const EIGHTH = 60 / 144 / 2;

const melodyAt = {};
let step = 0;
for (const [note, len] of MELODY) {
  if (note) melodyAt[step] = [note, len];
  step += len;
}

let ctx = null, master = null, timer = null, nextTime = 0, index = 0, playing = false;

function tone(f, start, dur, type, level) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = f;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(level, start + 0.01);
  gain.gain.setValueAtTime(level, start + dur * 0.8);
  gain.gain.linearRampToValueAtTime(0, start + dur * 0.95);
  osc.connect(gain).connect(master);
  osc.start(start);
  osc.stop(start + dur);
}

function scheduler() {
  while (nextTime < ctx.currentTime + 0.25) {
    if (melodyAt[index]) {
      const [note, len] = melodyAt[index];
      tone(freq(note), nextTime, len * EIGHTH, "square", 0.22);
    }
    const root = BASS_ROOTS[Math.floor(index / 8)];
    const octave = parseInt(root.slice(-1), 10) + (index % 2);
    tone(freq(root.slice(0, -1) + octave), nextTime, EIGHTH, "triangle", 0.35);
    nextTime += EIGHTH;
    index = (index + 1) % STEPS;
  }
}

const button = document.getElementById("m");
button.addEventListener("click", async () => {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0.12;
    master.connect(ctx.destination);
  }
  if (playing) {
    clearInterval(timer);
    await ctx.suspend();
    playing = false;
    button.textContent = "PLAY TRAIL MUSIC";
    button.classList.remove("on");
  } else {
    await ctx.resume();
    nextTime = ctx.currentTime + 0.05;
    timer = setInterval(scheduler, 50);
    playing = true;
    button.textContent = "STOP THE MUSIC";
    button.classList.add("on");
  }
});
</script>
