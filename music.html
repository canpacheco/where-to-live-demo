<!-- Trail music: an original 8-bit arrangement of "Korobeiniki", a Russian folk song in the public
     domain, synthesized with the Web Audio API. The engine lives in the app page (the parent of this
     frame), so it survives Streamlit reruns. Browsers allow sound only after the visitor interacts
     with the page, so the music starts on the first click, tap, or key press anywhere on the page.
     The speaker button mutes and unmutes it. -->
<style>
  html, body { margin: 0; background: transparent; }
  #spk { width: 40px; height: 40px; border: 0; padding: 0; cursor: pointer; background: #8BE04E;
         box-shadow: 3px 3px 0 #050705; display: flex; align-items: center; justify-content: center; }
  #spk.off { background: #3a4636; }
  #spk:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #050705; }
  #spk svg { width: 26px; height: 26px; }
</style>
<button id="spk" aria-label="Music on" title="Music on (click to mute)"></button>
<script>
const ICON_ON = '<svg viewBox="0 0 13 13" shape-rendering="crispEdges"><g fill="#0D110C">' +
  '<rect x="1" y="5" width="2" height="3"/><rect x="3" y="4" width="1" height="5"/><rect x="4" y="3" width="1" height="7"/>' +
  '<rect x="5" y="2" width="1" height="9"/><rect x="7" y="5" width="1" height="3"/><rect x="9" y="3" width="1" height="7"/>' +
  '<rect x="8" y="2" width="1" height="1"/><rect x="8" y="10" width="1" height="1"/><rect x="11" y="2" width="1" height="9"/>' +
  '<rect x="10" y="1" width="1" height="1"/><rect x="10" y="11" width="1" height="1"/></g></svg>';
const ICON_OFF = '<svg viewBox="0 0 13 13" shape-rendering="crispEdges"><g fill="#E9F5DB">' +
  '<rect x="1" y="5" width="2" height="3"/><rect x="3" y="4" width="1" height="5"/><rect x="4" y="3" width="1" height="7"/>' +
  '<rect x="5" y="2" width="1" height="9"/><rect x="7" y="4" width="1" height="1"/><rect x="8" y="5" width="1" height="1"/>' +
  '<rect x="9" y="6" width="1" height="1"/><rect x="10" y="7" width="1" height="1"/><rect x="11" y="8" width="1" height="1"/>' +
  '<rect x="11" y="4" width="1" height="1"/><rect x="10" y="5" width="1" height="1"/><rect x="8" y="7" width="1" height="1"/>' +
  '<rect x="7" y="8" width="1" height="1"/></g></svg>';

// The engine source is injected into the parent page so it keeps running if this frame reloads.
const ENGINE = `
(function () {
  if (window.__trailMusic) return;
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freq(name) {
    const sharp = name.includes("#");
    const octave = parseInt(name.slice(sharp ? 2 : 1), 10);
    const midi = 12 * (octave + 1) + NOTE[name[0]] + (sharp ? 1 : 0);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }
  const MELODY = [
    ["E5", 2], ["B4", 1], ["C5", 1], ["D5", 2], ["C5", 1], ["B4", 1],
    ["A4", 2], ["A4", 1], ["C5", 1], ["E5", 2], ["D5", 1], ["C5", 1],
    ["B4", 3], ["C5", 1], ["D5", 2], ["E5", 2],
    ["C5", 2], ["A4", 2], ["A4", 2], [null, 2],
    [null, 1], ["D5", 2], ["F5", 1], ["A5", 2], ["G5", 1], ["F5", 1],
    ["E5", 3], ["C5", 1], ["E5", 2], ["D5", 1], ["C5", 1],
    ["B4", 2], ["B4", 1], ["C5", 1], ["D5", 2], ["E5", 2],
    ["C5", 2], ["A4", 2], ["A4", 2], [null, 2]
  ];
  const BASS = ["E2", "A2", "G#2", "A2", "D2", "C2", "G#2", "A2"];
  const STEPS = 64, EIGHTH = 60 / 144 / 2;
  const melodyAt = {};
  let s = 0;
  for (const [note, len] of MELODY) { if (note) melodyAt[s] = [note, len]; s += len; }

  let muted = false;
  try { muted = localStorage.getItem("trailMusicMuted") === "1"; } catch (e) {}
  const AC = window.AudioContext || window.webkitAudioContext;
  // The audio graph: music notes -> musicBus (fades) -> lowpass (softens the square waves) -> master.
  // Blips, the drumroll, and the fanfare go straight to master, so silencing the music never cuts them.
  // The context is made on the first interaction (or first sound), not at load: a context made
  // before the visitor does anything starts blocked, and Chrome logs a warning about it.
  let ctx = null, master = null, musicBus = null;
  let timer = null, nextTime = 0, index = 0, everStarted = false, primed = false, suspendTimer = null;
  const voices = new Set();   // music notes that are queued or sounding
  const listeners = [];

  function sticky() { return navigator.userActivation ? navigator.userActivation.hasBeenActive : false; }
  function calm() { return Boolean(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  function ready(gesture) {
    if (ctx) return true;
    if (!AC || !(gesture || sticky())) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.12;
    master.connect(ctx.destination);
    const soften = ctx.createBiquadFilter();
    soften.type = "lowpass"; soften.frequency.value = 6000; soften.Q.value = 0;
    soften.connect(master);
    musicBus = ctx.createGain();
    musicBus.gain.value = 0;
    musicBus.connect(soften);
    return true;
  }
  // iOS Safari unlocks sound only when a sound starts inside a gesture, so the first gesture plays
  // one silent sample.
  function prime() {
    if (primed || !ctx) return;
    primed = true;
    try {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
      src.connect(ctx.destination);
      src.onended = () => src.disconnect();
      src.start(0);
    } catch (e) {}
  }

  function tone(f, start, dur, type, level, music) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.value = f;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(level, start + 0.01);
    gain.gain.setValueAtTime(level, start + dur * 0.8);
    gain.gain.linearRampToValueAtTime(0, start + dur * 0.95);
    osc.connect(gain).connect(music ? musicBus : master);
    const voice = { osc: osc, end: start + dur };
    if (music) voices.add(voice);
    osc.onended = () => { voices.delete(voice); osc.disconnect(); gain.disconnect(); };
    osc.start(start); osc.stop(start + dur);
  }
  function scheduler() {
    while (nextTime < ctx.currentTime + 0.3) {
      if (melodyAt[index]) { const [n, l] = melodyAt[index]; tone(freq(n), nextTime, l * EIGHTH, "square", 0.22, true); }
      const root = BASS[Math.floor(index / 8)];
      const oct = parseInt(root.slice(-1), 10) + (index % 2);
      tone(freq(root.slice(0, -1) + oct), nextTime, EIGHTH, "triangle", 0.35, true);
      nextTime += EIGHTH;
      index = (index + 1) % STEPS;
    }
  }
  // Ends every queued or sounding music note by audio time "at".
  function cut(at) {
    for (const v of voices) {
      if (v.end > at) { try { v.osc.stop(at); } catch (e) {} v.end = at; }
    }
  }
  // Stops the music: fades the music bus out, ends the queued notes at the end of the fade, and
  // (when asked) suspends the context once the fade is done.
  function silence(fade, suspend) {
    if (timer !== null) { clearInterval(timer); timer = null; }
    clearTimeout(suspendTimer); suspendTimer = null;
    if (!ctx) return;
    const now = ctx.currentTime, g = musicBus.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.setTargetAtTime(0, now, fade / 4);
    cut(now + fade);
    if (suspend) {
      suspendTimer = setTimeout(() => {
        suspendTimer = null;
        if (timer === null) ctx.suspend().catch(() => {});
      }, fade * 1000 + 60);
    }
  }
  function playing() { return ctx !== null && ctx.state === "running" && timer !== null; }
  function musicAllowed() { return !document.querySelector(".no-music"); }
  function notify() { for (const f of listeners) { try { f(); } catch (e) {} } }
  function start(gesture) {
    if (muted || document.hidden) return;
    if (!ready(gesture)) return;
    if (gesture) prime();
    clearTimeout(suspendTimer); suspendTimer = null;
    ctx.resume().then(() => {
      if (ctx.state !== "running") return;
      if (timer === null && musicAllowed() && !muted && !document.hidden) {
        const now = ctx.currentTime, g = musicBus.gain;
        // Any note left from a fade still under way ends first; the new stream fades in after it.
        g.cancelScheduledValues(now);
        g.setValueAtTime(g.value, now);
        g.linearRampToValueAtTime(0, now + 0.03);
        cut(now + 0.03);
        nextTime = now + 0.1;
        g.setValueAtTime(0, nextTime - 0.01);
        g.linearRampToValueAtTime(1, nextTime + (everStarted ? 0.2 : 1.0));
        everStarted = true;
        scheduler();
        timer = setInterval(scheduler, 50);
      }
      notify();
    }).catch(() => {});
  }
  function stop() {
    silence(0.1, true);
    notify();
  }
  // Any press, tap, or key unlocks the sound. A touch pointerdown alone does not count as a gesture
  // on iOS, hence the list. The speaker button is left to toggle(), which starts the music itself;
  // starting it here first would make that same click mute it.
  function unlock(e) {
    const t = e.target;
    if (t && t.closest && t.closest("#spk")) return;
    start(true);
  }
  ["pointerdown", "pointerup", "touchend", "keydown", "click"].forEach(t => document.addEventListener(t, unlock, true));
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else start(false); });
  // A first click inside another frame (the drag list) never reaches this page's listeners, but it
  // still counts as an interaction, so check once a second until the music is running.
  const waiter = setInterval(() => {
    if (playing()) { clearInterval(waiter); return; }
    if (!musicAllowed()) return;
    if (sticky() && !muted) start(false);
  }, 1000);

  // Sound effects, silenced by the same mute as the music. data-sound="back" plays a falling blip,
  // data-sound="soft" a quiet tick, and anything else the usual rising blip.
  function blip(kind) {
    if (muted || !ready(true)) return;
    const notes = kind === "back" ? [[1319, 0, 0.07, 0.24], [988, 0.07, 0.1, 0.24]]
      : kind === "soft" ? [[880, 0, 0.05, 0.12]]
      : [[988, 0, 0.07, 0.24], [1319, 0.07, 0.1, 0.24]];
    ctx.resume().then(() => {
      const t = ctx.currentTime + 0.01;
      for (const [f, at, d, level] of notes) tone(f, t + at, d, "square", level, false);
    }).catch(() => {});
  }
  // The reveal: ten rising drum ticks, one per step of the 1.4 s loading bar (steps(10), so a step
  // every 0.14 s), then the fanfare as the title lands. With reduced motion the page shows the
  // reveal at once, so the fanfare plays at once and the ticks are left out.
  function fanfare() {
    if (muted || !ready(false)) return;
    const asked = performance.now(), still = calm();
    ctx.resume().then(() => {
      // A context that waits for a gesture (a reload on the reveal page) would otherwise play the
      // fanfare after the next click, on top of the next page.
      if (ctx.state !== "running" || performance.now() - asked > 400) return;
      // t0 is the audio time that reaches the speakers at the moment the cue appeared, so the ticks
      // land on the bar's steps despite the output latency.
      const o = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
      const t0 = o && o.performanceTime > 0 ? o.contextTime + (asked - o.performanceTime) / 1000 : ctx.currentTime;
      if (!still) {
        for (let k = 1; k <= 10; k++) {
          const at = t0 + 0.14 * k;
          if (at > ctx.currentTime) tone(110 * Math.pow(2, (k - 1) / 9), at, 0.05, "triangle", 0.05, false);
        }
      }
      const notes = [[523, 0.12], [659, 0.12], [784, 0.12], [1047, 0.42], [784, 0.12], [1047, 0.6]];
      let at = Math.max(t0 + (still ? 0.1 : 1.55), ctx.currentTime + 0.02);
      for (const [f, d] of notes) { tone(f, at, d, "square", 0.32, false); tone(f / 2, at, d, "triangle", 0.4, false); at += d; }
    }).catch(() => {});
  }
  document.addEventListener("click", (e) => {
    const hit = e.target && e.target.closest && e.target.closest('[class*="st-key-pick_"], [class*="st-key-go_"]');
    if (hit) { start(true); blip(hit.dataset ? hit.dataset.sound : undefined); }
  }, true);
  let lastCue = null;
  new MutationObserver(() => {
    const cue = document.querySelector(".fanfare-cue");
    if (cue && cue.dataset.cue !== lastCue) { lastCue = cue.dataset.cue; fanfare(); }
    if (!musicAllowed() && timer !== null) { silence(0.15, false); index = 0; notify(); }
    if (musicAllowed() && timer === null && !muted && sticky()) start(false);
  }).observe(document.body, { childList: true, subtree: true });

  window.__trailMusic = {
    isMuted: () => muted,
    isPlaying: playing,
    onChange: f => listeners.push(f),
    toggle: () => {
      if (!muted && !playing()) { start(true); return; }
      muted = !muted;
      try { localStorage.setItem("trailMusicMuted", muted ? "1" : "0"); } catch (e) {}
      if (muted) stop(); else start(true);
      notify();
    }
  };
  start(false);
})();
`;

const button = document.getElementById("spk");
let music = null;
try {
  const parentWindow = window.parent;
  if (!parentWindow.__trailMusic) {
    const tag = parentWindow.document.createElement("script");
    tag.textContent = ENGINE;
    parentWindow.document.head.appendChild(tag);
  }
  music = parentWindow.__trailMusic;
} catch (e) {
  music = null;
}

function draw() {
  const on = music && !music.isMuted();
  button.innerHTML = on ? ICON_ON : ICON_OFF;
  button.classList.toggle("off", !on);
  button.setAttribute("aria-label", on ? "Music on" : "Music off");
  button.title = on ? "Music on (click to mute)" : "Music off (click to play)";
}
if (music) {
  music.onChange(draw);
  button.addEventListener("click", () => music.toggle());
}
draw();
</script>
